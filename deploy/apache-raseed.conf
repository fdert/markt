# إعداد Apache كوكيل عكسي لنظام رصيد (للخوادم التي يشغّل فيها Apache المنفذين 80 و443)
# الاستخدام: انسخه إلى /etc/apache2/sites-available/raseed.conf واستبدل النطاق والمنفذ ثم:
#   a2enmod proxy proxy_http headers && a2ensite raseed && systemctl reload apache2
#   certbot --apache -d pos.example.sa
<VirtualHost *:80>
    ServerName pos.example.sa
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:18090/
    ProxyPassReverse / http://127.0.0.1:18090/
    RequestHeader set X-Forwarded-Proto "http"
    LimitRequestBody 20971520
</VirtualHost>
